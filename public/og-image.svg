<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0c1a0c"/>
      <stop offset="50%" style="stop-color:#132213"/>
      <stop offset="100%" style="stop-color:#1b331b"/>
    </linearGradient>
    <radialGradient id="glow1" cx="20%" cy="40%" r="50%">
      <stop offset="0%" style="stop-color:rgba(45,106,46,0.3)"/>
      <stop offset="100%" style="stop-color:transparent"/>
    </radialGradient>
    <radialGradient id="glow2" cx="80%" cy="30%" r="40%">
      <stop offset="0%" style="stop-color:rgba(232,117,26,0.15)"/>
      <stop offset="100%" style="stop-color:transparent"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow1)"/>
  <rect width="1200" height="630" fill="url(#glow2)"/>

  <!-- Top accent line -->
  <rect x="0" y="0" width="1200" height="4" fill="#2d6a2e"/>
  <rect x="600" y="0" width="600" height="4" fill="#e8751a" opacity="0.7"/>

  <!-- Brand name -->
  <text x="600" y="240" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="72">
    <tspan fill="#4e9a47">MAC</tspan><tspan fill="#e8751a" dx="12">Educando</tspan>
  </text>

  <!-- Subtitle -->
  <text x="600" y="300" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="500" font-size="24" fill="#a8cda8" letter-spacing="4">M ADVISER AND CONSULTANT INC.</text>

  <!-- Divider -->
  <rect x="500" y="340" width="200" height="2" rx="1" fill="#4e9a47" opacity="0.5"/>

  <!-- Tagline -->
  <text x="600" y="400" text-anchor="middle" font-family="Georgia, serif" font-size="32" fill="#e8f5e8">Centro de Servicios Educativos</text>
  <text x="600" y="445" text-anchor="middle" font-family="Georgia, serif" font-size="28" fill="#a8cda8">en Puerto Rico</text>

  <!-- Services line -->
  <text x="600" y="510" text-anchor="middle" font-family="system-ui, sans-serif" font-size="18" fill="#a8cda8" opacity="0.7">Evaluaciones · Terapias · Apoyo Educativo</text>

  <!-- Bottom accent -->
  <rect x="0" y="626" width="1200" height="4" fill="#2d6a2e"/>

  <!-- Website URL -->
  <text x="600" y="590" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="600" font-size="16" fill="#4e9a47" letter-spacing="2">MACEDUCANDO.COM</text>
</svg>
